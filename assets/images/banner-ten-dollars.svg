<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="title desc">
<title id="title">What it takes to earn about $10 a month from banner ads</title>
<desc id="desc">An example: 400 daily active players, each seeing two banner ads per day, generate 24,000 impressions over 30 days. At $0.40 per thousand impressions, that earns $9.60, or about $10 a month.</desc>
<rect width="720" height="790" rx="20" fill="#fff0f3"/>
<g font-family="Arial, sans-serif" fill="#282729">
<text x="40" y="52" font-size="17" letter-spacing="2" fill="#b32950">THE MATH BEHIND THE BADGE</text>
<text x="40" y="103" font-family="Georgia, serif" font-size="38">A whole month. About $10.</text>
<rect x="32" y="138" width="656" height="160" rx="12" fill="#fbfaf7"/>
<text x="56" y="197" font-size="46" font-weight="bold">400 players</text>
<text x="56" y="237" font-size="23">active every day</text>
<text x="56" y="274" font-size="21" fill="#716f71">2 banner impressions each per day</text>
<path d="M360 307v29m-8-8 8 8 8-8" fill="none" stroke="#b32950" stroke-width="3"/>
<rect x="32" y="349" width="656" height="145" rx="12" fill="#fbfaf7"/>
<text x="56" y="407" font-size="46" font-weight="bold">24,000 impressions</text>
<text x="56" y="450" font-size="23">400 players × 2 ads × 30 days</text>
<path d="M360 504v29m-8-8 8 8 8-8" fill="none" stroke="#b32950" stroke-width="3"/>
<rect x="32" y="546" width="656" height="158" rx="12" fill="#282729"/>
<text x="56" y="611" font-size="51" font-weight="bold" fill="#fbfaf7">$9.60 / month</text>
<text x="56" y="662" font-size="23" fill="#fbfaf7">At $0.40 per 1,000 impressions</text>
<text x="40" y="744" font-size="19" fill="#716f71">Illustrative calculation. Actual ad revenue varies.</text>
<text x="40" y="774" font-size="16" fill="#716f71">Banner ads only · Before costs · 30-day month</text>
</g></svg>